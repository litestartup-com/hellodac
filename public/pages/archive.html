<div class="wrap">
  <div class="page-head">
    <h1>{{t:archive.title}}</h1>
    <span id="archive-count" class="muted small"></span>
  </div>

  <!-- Says out loud what archiving did and did not do. Without this the page is
       a list of rows with no explanation of why the transcript still exists. -->
  <p class="muted small">
    {{t:archive.note}}
  </p>

  <div id="archive-notice"></div>

  <div id="archive-list" class="arch-list">
    <div class="skeleton w60"></div>
    <div class="skeleton w40"></div>
  </div>
</div>
