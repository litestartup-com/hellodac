<div class="wrap">
  <div class="page-head">
    <h1 class="grow">{{t:crons.title}}</h1>
    <span class="muted small">{{t:crons.subtitle}}</span>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>{{t:crons.schedules}}</h2>
      <span id="crons-refresh" class="muted small"></span>
    </div>
    <div id="crons-list" class="card list"><p class="muted small">{{t:common.loading}}</p></div>
  </section>

  <section class="section" id="crons-edit" hidden>
    <div class="section-head"><h2>{{t:crons.edit}}</h2></div>
    <div class="card">
      <p class="muted small" id="crons-edit-meta"></p>
      <textarea id="crons-prompt" class="prompt-box" rows="14"></textarea>
      <div class="row-actions">
        <button type="button" class="btn small" id="crons-save">{{t:crons.save}}</button>
        <button type="button" class="btn small" id="crons-cancel">{{t:crons.cancel}}</button>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>{{t:crons.newTitle}}</h2></div>
    <div class="card">
      <div class="grid">
        <label>{{t:crons.name}}<input type="text" id="crons-new-name" placeholder="duty-call" /></label>
        <label>{{t:crons.agentId}}<input type="text" id="crons-new-agent" placeholder="kanban-brain" /></label>
        <label>{{t:crons.scheduleLabel}}<input type="text" id="crons-new-schedule" placeholder="*/20 * * * *" /></label>
      </div>
      <textarea id="crons-new-prompt" class="prompt-box" rows="6" placeholder="{{t:crons.promptHint}}"></textarea>
      <div class="row-actions">
        <button type="button" class="btn small" id="crons-create">{{t:crons.create}}</button>
        <span class="muted small" id="crons-create-msg"></span>
      </div>
    </div>
  </section>
</div>
