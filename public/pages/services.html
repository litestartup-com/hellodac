<div class="wrap">
  <!-- ── List view ─────────────────────────────────────────────────────────── -->
  <section id="view-list">
    <div class="page-head">
      <h1 class="grow">{{t:services.title}}</h1>
      <button id="new-service" class="btn btn-sm" type="button">
        <svg width="14" height="14"><use href="#i-add" /></svg>
        {{t:services.new}}
      </button>
      <span id="services-refresh" class="muted small"></span>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>{{t:services.all}}</h2>
        <span id="services-count" class="muted small"></span>
      </div>
      <div class="card">
        <div id="services-list" class="nodes-list"><p class="muted small">{{t:common.loading}}</p></div>
      </div>
    </section>
  </section>

  <!-- ── Detail view (full width) ──────────────────────────────────────────── -->
  <section id="view-detail" hidden>
    <div class="page-head">
      <h1 id="service-detail-title" class="grow"></h1>
      <a id="service-detail-key" class="btn-quiet btn-sm" href="/keys" type="button">{{t:services.issueKey}}</a>
      <button id="service-detail-edit" class="btn-quiet btn-sm" type="button">{{t:services.edit}}</button>
      <button id="service-detail-delete" class="btn-quiet btn-sm" type="button">{{t:services.delete}}</button>
    </div>
    <button id="back-list" class="btn-quiet btn-sm back-link" type="button">← {{t:services.all}}</button>
    <div id="service-detail-body"></div>
  </section>

  <!-- ── Edit view (full width) ────────────────────────────────────────────── -->
  <section id="view-form" hidden>
    <div class="page-head">
      <h1 class="grow">{{t:services.editTitle}}</h1>
    </div>
    <button id="back-detail" class="btn-quiet btn-sm back-link" type="button">← {{t:services.edit}}</button>
    <div id="edit-form-slot"></div>
  </section>
</div>

<!-- ── Drawer: the editor (create + edit share it) ─────────────────────────── -->
<div id="service-editor" class="panel" hidden>
  <div class="panel-backdrop" data-close="1"></div>
  <aside class="panel-body panel-wide" role="dialog" aria-modal="true" aria-labelledby="service-editor-title">
    <header class="panel-head">
      <h2 id="service-editor-title">{{t:services.editorNew}}</h2>
      <button class="icon-btn" type="button" data-close="1" aria-label="{{t:common.close}}">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </header>
    <div class="panel-content" id="service-editor-slot"></div>
  </aside>
</div>
