<div class="wrap">
  <!-- ── List view ─────────────────────────────────────────────────────────── -->
  <section id="view-list">
    <div class="page-head">
      <h1 class="grow">{{t:keys.title}}</h1>
      <button id="new-key" class="btn btn-sm" type="button">
        <svg width="14" height="14"><use href="#i-add" /></svg>
        {{t:keys.new}}
      </button>
      <span id="keys-refresh" class="muted small"></span>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>{{t:keys.all}}</h2>
        <span id="keys-count" class="muted small"></span>
        <span class="grow"></span>
        <div id="keys-filter" class="filter-row"></div>
      </div>
      <div class="card">
        <div id="keys-list" class="nodes-list"><p class="muted small">{{t:common.loading}}</p></div>
      </div>
    </section>
  </section>

  <!-- ── Detail view (full width) ──────────────────────────────────────────── -->
  <section id="view-detail" hidden>
    <div class="page-head">
      <h1 id="key-detail-title" class="grow"></h1>
      <button id="key-detail-edit" class="btn-quiet btn-sm" type="button">{{t:keys.edit}}</button>
      <button id="key-detail-revoke" class="btn-quiet btn-sm" type="button">{{t:keys.revoke}}</button>
    </div>
    <button id="back-list" class="btn-quiet btn-sm back-link" type="button">← {{t:keys.all}}</button>
    <div id="key-detail-body"></div>
    <section id="key-activity" class="section" hidden>
      <div class="section-head"><h2>{{t:keys.activity}}</h2></div>
      <div class="card"><div id="key-activity-body" class="nodes-list"></div></div>
    </section>
  </section>

  <!-- ── Edit view (full width) ────────────────────────────────────────────── -->
  <section id="view-form" hidden>
    <div class="page-head">
      <h1 class="grow">{{t:keys.editTitle}}</h1>
    </div>
    <button id="back-detail" class="btn-quiet btn-sm back-link" type="button">← {{t:keys.edit}}</button>
    <div id="edit-form-slot"></div>
  </section>
</div>

<!-- ── Drawer: new key ─────────────────────────────────────────────────────── -->
<div id="key-editor" class="panel" hidden>
  <div class="panel-backdrop" data-close="1"></div>
  <aside class="panel-body panel-wide" role="dialog" aria-modal="true" aria-labelledby="key-editor-title">
    <header class="panel-head">
      <h2 id="key-editor-title">{{t:keys.new}}</h2>
      <button class="icon-btn" type="button" data-close="1" aria-label="{{t:common.close}}">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </header>
    <div class="panel-content">
      <div id="key-form-slot"></div>

      <!-- Result step inside the drawer: the secret exists once, here. -->
      <div id="key-issued" hidden>
        <h3 class="section-label">{{t:keys.tokenOnce}}</h3>
        <div class="token-row">
          <code class="token-value" id="key-token-value"></code>
          <button type="button" class="btn" id="key-token-copy">{{t:keys.copy}}</button>
        </div>
        <p class="muted small">{{t:keys.tokenOnceNote}}</p>

        <h3 class="section-label">{{t:keys.testNow}}</h3>
        <button type="button" class="btn ghost" id="key-probe">{{t:keys.testRun}}</button>
        <div id="key-probe-result"></div>

        <h3 class="section-label">{{t:keys.handover}}</h3>
        <div id="key-handover" class="muted small"></div>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="key-handover-copy">{{t:keys.handoverCopy}}</button>
          <button type="button" class="btn" id="key-done">{{t:keys.done}}</button>
          <span id="key-handover-msg" class="muted small"></span>
        </div>
      </div>
    </div>
  </aside>
</div>
