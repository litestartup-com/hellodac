<div class="wrap">
  <div class="page-head">
    <h1 class="grow">{{t:keys.title}}</h1>
    <span id="keys-refresh" class="muted small"></span>
  </div>

  <div id="keys-note" class="card muted small">{{t:keys.note}}</div>

  <section class="section">
    <div class="section-head">
      <h2>{{t:keys.listener}}</h2>
      <span id="keys-listener" class="muted small">{{t:common.loading}}</span>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>{{t:keys.create}}</h2>
      <span class="muted small">{{t:keys.createNote}}</span>
    </div>

    <form id="key-form" class="card narrow">
      <p id="key-create-msg" class="muted" hidden></p>

      <label for="key-name">{{t:keys.name}}</label>
      <input id="key-name" type="text" maxlength="80" placeholder="{{t:keys.nameHint}}" />

      <label for="key-services">{{t:keys.services}}</label>
      <select id="key-services"></select>

      <label>{{t:keys.scopes}}</label>
      <div id="key-scopes" class="checks">
        <label class="check"><input type="checkbox" value="services:read" checked /> <span>services:read</span></label>
        <label class="check"><input type="checkbox" value="usage:read" checked /> <span>usage:read</span></label>
        <label class="check"><input type="checkbox" value="tasks:write" /> <span>tasks:write</span></label>
        <label class="check"><input type="checkbox" value="conversations:write" /> <span>conversations:write</span></label>
        <label class="check"><input type="checkbox" value="interactions:write" /> <span>interactions:write</span></label>
      </div>

      <label for="key-quota">{{t:keys.quota}}</label>
      <input id="key-quota" type="number" min="1" value="200" />

      <button type="submit" id="key-create" class="btn primary">{{t:keys.createAction}}</button>
      <div id="key-token" class="token-reveal" hidden></div>
    </form>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>{{t:keys.existing}}</h2>
    </div>
    <div id="keys-list" class="nodes-list"><p class="muted small">{{t:common.loading}}</p></div>
  </section>
</div>
