<div class="wrap">
  <div class="page-head">
    <h1 class="grow">{{t:password.title}}</h1>
  </div>

  <form id="password-form" class="card narrow">
    <p id="password-note" class="muted">
      {{t:password.mustChange}}
    </p>

    <label for="current">{{t:password.current}}</label>
    <input id="current" type="password" autocomplete="current-password" required />

    <label for="next">{{t:password.next}}</label>
    <input id="next" type="password" autocomplete="new-password" minlength="10" required />

    <label for="confirm">{{t:password.confirm}}</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="10" required />

    <button type="submit" id="save">{{t:password.submit}}</button>
    <p id="error" class="error" hidden></p>
  </form>
</div>
