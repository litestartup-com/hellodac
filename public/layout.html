<!doctype html>
<html lang="{{LOCALE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="/assets/style.css" />
    {{HEAD}}
  </head>
  <body>
    <!-- Icons are inlined as a sprite: a handful of 16px line icons is not worth
         a network request, and this keeps the front end dependency-free.

         Living in the layout rather than in each page is the point of the
         layout: `i-alert` used to be defined four times and `i-back` three, so
         a tweak to one of them silently applied to one page out of four. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="8" cy="8" r="6.25" />
          <path d="M8 5.5v5M5.5 8h5" />
        </g>
        <!-- Distinct from i-plus on purpose: the circled one is the primary
             "派活" action, this bare one sits inside ordinary buttons. -->
        <g id="i-add" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M8 3.5v9M3.5 8h9" />
        </g>
        <g id="i-folder" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M2 4.5a1 1 0 0 1 1-1h2.6l1.2 1.4H13a1 1 0 0 1 1 1v6.6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" />
        </g>
        <g id="i-up" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 12.5v-9M4.25 7.25 8 3.5l3.75 3.75" />
        </g>
        <!-- The mirror of i-up, for the scroll-to-bottom control. -->
        <g id="i-down" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3.5v9M4.25 8.75 8 12.5l3.75-3.75" />
        </g>
        <g id="i-chev" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.5 10.5 8 6 12.5" />
        </g>
        <!-- A conversation, for the chat rows in the sidebar. -->
        <g id="i-chat" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M13.25 9.5a1 1 0 0 1-1 1H6.5L3.5 13V4.5a1 1 0 0 1 1-1h7.75a1 1 0 0 1 1 1z" />
        </g>
        <!-- 蜂群：主脑 = 蜂后。蜂巢格 + 中心点，是「总控」，不是又一个会话气泡。 -->
        <g id="i-hive" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M8 1.75 13.4 4.9v6.2L8 14.2 2.6 11.1V4.9z" />
          <circle cx="8" cy="8" r="2.2" fill="currentColor" stroke="none" />
        </g>
        <!-- Archive: a box with a lid, not a bin. The distinction is the whole
             point -- nothing is destroyed. -->
        <g id="i-archive" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <rect x="2.25" y="3" width="11.5" height="3" rx="0.75" />
          <path d="M3.25 6v6.25a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V6M6.5 8.75h3" stroke-linecap="round" />
        </g>
        <!-- Row overflow. Three dots, because it is the one glyph users already
             read as "more actions on this row".

             The dots are r=1.5 and spread to the edges of the 16-unit box: at
             r=1.15 they rendered as three single pixels, which is a glyph in
             theory and a smudge in practice. -->
        <g id="i-more" fill="currentColor">
          <circle cx="2.9" cy="8" r="1.5" />
          <circle cx="8" cy="8" r="1.5" />
          <circle cx="13.1" cy="8" r="1.5" />
        </g>
        <!-- ⋮ 溢出菜单入口：竖排三点（与行菜单的横排 #i-more 区分语义）。 -->
        <g id="i-more-v" fill="currentColor">
          <circle cx="8" cy="2.9" r="1.5" />
          <circle cx="8" cy="8" r="1.5" />
          <circle cx="8" cy="13.1" r="1.5" />
        </g>
        <!-- GitHub 标记（侧栏入口用）：实心字形，与线框图标区分开。 -->
        <g id="i-github" fill="currentColor">
          <path d="M8 1.2a6.8 6.8 0 0 0-2.15 13.25c.34.06.46-.15.46-.33v-1.16c-1.89.41-2.29-.91-2.29-.91-.31-.79-.76-.99-.76-.99-.62-.42.05-.41.05-.41.68.05 1.04.7 1.04.7.61 1.04 1.6.74 1.99.57.06-.44.24-.74.43-.91-1.51-.17-3.1-.76-3.1-3.36 0-.74.26-1.35.7-1.83-.07-.17-.3-.86.07-1.79 0 0 .56-.18 1.85.7a6.4 6.4 0 0 1 3.37 0c1.28-.88 1.85-.7 1.85-.7.37.93.14 1.62.07 1.79.44.48.7 1.09.7 1.83 0 2.61-1.6 3.19-3.11 3.36.25.21.46.62.46 1.26v1.86c0 .18.12.4.47.33A6.8 6.8 0 0 0 8 1.2z" />
        </g>
        <!-- A gateway endpoint: a DSH process, drawn as the two-bay box that
             every ops UI uses for "a server". The shape says *what* the control
             reports on; the state dot layered over it says how it is doing. A
             bare coloured dot said only the second half, which is why nobody
             could tell it apart from decoration. -->
        <g id="i-endpoint" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <rect x="2.5" y="2.9" width="11" height="4.6" rx="1.2" />
          <rect x="2.5" y="8.5" width="11" height="4.6" rx="1.2" />
          <circle cx="5.1" cy="5.2" r="0.75" fill="currentColor" stroke="none" />
          <circle cx="5.1" cy="10.8" r="0.75" fill="currentColor" stroke="none" />
        </g>
        <!-- 节点（服务器）：带指示灯与卡槽的服务器正脸，侧栏「节点」入口用，
             与 i-endpoint（端点健康）区分开。 -->
        <g id="i-server" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <rect x="2.5" y="2.75" width="11" height="10.5" rx="1.25" />
          <path d="M2.5 6.75h11" />
          <circle cx="5" cy="4.9" r="0.9" fill="currentColor" stroke="none" />
          <circle cx="8" cy="4.9" r="0.9" fill="currentColor" stroke="none" />
          <circle cx="11" cy="4.9" r="0.9" fill="currentColor" stroke="none" />
          <path d="M5 9.5h6" />
        </g>
        <!-- 技能（招式包）：闪电。侧栏「技能」入口用。 -->
        <g id="i-spark" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M8.6 1.9 4.9 9h2.1L6.4 14.1l4.7-7.1H9L10.6 1.9z" />
        </g>
        <!-- 通知（铃铛）：站内信入口。 -->
        <g id="i-bell" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 6.75a5 5 0 0 0-10 0c0 3.25 1.1 4.4 2 5.25h6c.9-.85 2-2 2-5.25z" />
          <path d="M6.4 13.25a1.75 1.75 0 0 0 3.2 0" />
        </g>
        <g id="i-alert" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M8 2.75 14.25 13.5H1.75z" stroke-linejoin="round" />
          <path d="M8 6.5v3.25M8 11.75v.5" />
        </g>
        <!-- Permission. A shield rather than i-alert: an approval prompt is a
             decision waiting on someone, not something that went wrong. -->
        <g id="i-shield" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M8 2.25l5 1.75v4.1c0 2.6-2 4.6-5 5.65-3-1.05-5-3.05-5-5.65V4z" />
        </g>
        <g id="i-coin" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6.25" />
          <path d="M9.75 5.75H7.4a1.4 1.4 0 0 0 0 2.8h1.2a1.4 1.4 0 0 1 0 2.8H6.25M8 4.6v.9M8 10.5v.9" stroke-linecap="round" />
        </g>
        <!-- 任务史（时钟 + 逆时针回卷箭头）：侧栏「任务」入口用。 -->
        <g id="i-history" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 3.5v3h3" />
          <path d="M2.75 6.5a6.25 6.25 0 1 1-.55 3.7" />
          <path d="M8 4.75V8l2.4 1.65" />
        </g>
        <g id="i-play" fill="currentColor">
          <path d="M5 3.5v9l7.5-4.5z" />
        </g>
        <!-- Navigation chrome. One icon for both jobs it has: on a wide screen it
             collapses the docked sidebar to a rail, on a narrow one the hamburger
             opens the same sidebar as a drawer. -->
        <g id="i-panel-left" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <rect x="2.25" y="2.75" width="11.5" height="10.5" rx="1.25" />
          <path d="M6.25 2.75v10.5" />
        </g>
        <g id="i-menu" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
        </g>
        <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8" />
        </g>
        <!-- Log out: the arrow leaves the frame. Distinct from i-close, which
             dismisses a panel and must never read as "sign me out". -->
        <g id="i-logout" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.25h5.5a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1H6" />
          <path d="M10.25 8H2.75M5 5.75 2.75 8 5 10.25" />
        </g>
        <!-- The agent's face in a conversation: a round head with eyes and an
             antenna. Same glyph everywhere an agent speaks, so a bot avatar
             never needs per-agent art. -->
        <g id="i-bot" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.75" y="4.25" width="10.5" height="8" rx="2.75" />
          <circle cx="5.9" cy="8.25" r="0.8" fill="currentColor" stroke="none" />
          <circle cx="10.1" cy="8.25" r="0.8" fill="currentColor" stroke="none" />
          <path d="M8 4.25V2.5M8 2.5h1.6" />
        </g>
        <!-- Done. A check in a rounded box, so it reads as a state chip rather
             than a bare tick. -->
        <g id="i-check" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.25" y="2.25" width="11.5" height="11.5" rx="3.5" />
          <path d="m5.5 8.25 1.85 1.85 3.15-4.2" />
        </g>
        <!-- Copy: two sheets, one behind the other. -->
                <!-- Edit / undo: a pencil. Queued turns use it to pull the draft back
             into the composer. -->
        <g id="i-pencil" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 3.25a1.4 1.4 0 0 1 2 2L6 12.75l-3 .75.75-3z" />
          <path d="M9.75 5 11.5 6.75" />
        </g>
        <!-- Delete: a trash can. Queued turns use it to drop the item entirely. -->
        <g id="i-trash" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.25 4.75h9.5M6.25 4.75V3.5h3.5v1.25M4.75 4.75l.6 8h5.3l.6-8M6.75 7v3.75M9.25 7v3.75" />
        </g>
        <g id="i-copy" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <rect x="5.25" y="5.25" width="8" height="8" rx="1.5" />
          <path d="M10.75 5.25V4a1 1 0 0 0-1-1H4.5a1 1 0 0 0-1 1v5.25a1 1 0 0 0 1 1h1.25" />
        </g>
        <!-- Feedback: an up and a down thumb, the pair users already read as
             "this was / was not helpful". -->
        <g id="i-thumb-up" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 13.5H3.25a1 1 0 0 1-1-1V7.75a1 1 0 0 1 1-1H6.5" />
          <path d="M6.5 6.75 8.6 3a1.5 1.5 0 0 1 2.65 1v2.75h2.5a1.25 1.25 0 0 1 1.24 1.4l-.55 4.1a1.5 1.5 0 0 1-1.5 1.35H6.5z" />
        </g>
        <g id="i-thumb-down" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2.5h3.25a1 1 0 0 1 1 1v4.75a1 1 0 0 1-1 1H9.5" />
          <path d="M9.5 9.25 7.4 13a1.5 1.5 0 0 1-2.65-1V9.25H2.25a1.25 1.25 0 0 1-1.24-1.4l.55-4.1a1.5 1.5 0 0 1 1.5-1.35H9.5z" />
        </g>
      </defs>
    </svg>

    <!-- The narrow-screen app bar. Hidden above 1024px, where the sidebar is
         docked and there is nothing for it to do. It is fixed rather than sticky
         so the conversation page can keep owning exactly one scroll container. -->
    <header class="topbar">
      <button
        id="nav-open"
        class="icon-btn topbar-btn"
        type="button"
        aria-label="{{t:side.openNav}}"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg width="18" height="18" aria-hidden="true"><use href="#i-menu" /></svg>
      </button>
      <span id="topbar-title" class="topbar-title">{{BRAND}}</span>
    </header>

    <!-- Dismisses the drawer. A real element rather than a pseudo-element so the
         tap target is unambiguous and it can be aria-hidden. -->
    <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>

    <div class="shell">
      <aside id="sidebar" class="sidebar">
        <div class="side-top">
          <!-- The brand is the way home. Every page used to carry its own 返回
               button, which is a worse version of a frame that never leaves. -->
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">{{BRAND_MARK}}</span>
            <span class="brand-text">
              {{BRAND}}
              <span class="brand-sub">{{BRAND_SUB}}</span>
            </span>
          </a>
          <!-- Collapses the sidebar on a wide screen, closes the drawer on a
               narrow one. One control, because to the user it is one thing: the
               sidebar getting out of the way. -->
          <button id="nav-collapse" class="icon-btn side-collapse" type="button" aria-label="{{t:side.collapse}}" title="{{t:side.collapse}} ([)">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-panel-left" /></svg>
          </button>
        </div>

        <!-- 蜂群 P3：主脑入口（钉顶、不折叠）。config 里有 brain agent 才
             渲染——没有主脑就没有这个按钮，界面不撒谎。 -->
        <div id="side-brain" hidden></div>

        <div class="side-section">
          <span class="grow">{{t:side.agents}}</span>
          <span id="agent-count"></span>
        </div>

        <nav id="agent-nav" class="tree" aria-label="{{t:side.agentList}}">
          <div class="skeleton w60"></div>
          <div class="skeleton w40"></div>
        </nav>

        <!-- 主导航（DAC v1.0.0）：节点 / 任务常驻侧栏，其余（技能/已归档/花费/
             审计/改密）收进左下角 ⋮ 弹窗。shell.js 填充，与 ⋮ 菜单共用同一份
             链接语言（data-nav 决定高亮）。 -->
        <nav id="side-primary" class="side-links" aria-label="{{t:side.primary}}"></nav>

        <!-- 底部菜单（节点/技能/定时/归档/花费/审计/改密/退出登录）已收进
             左下角 ⋮ 弹窗（shell.js 动态构建，锚定 side-more 按钮向上打开）。
             侧栏本体只留 agent 树 + 端点状态，任务区最大。 -->

        <!-- Endpoint health and session counts: standing facts, one quiet line
             per endpoint. They used to live on the home page inside a collapsible
             box, which made operator detail the page's second act; here they are
             visible from anywhere without competing with the task at hand. -->
        <div class="side-endpoints" id="side-endpoints"></div>

        <div class="side-foot">
          <span id="avatar" class="side-avatar" aria-hidden="true"></span>
          <span id="who" class="grow"></span>
          <!-- 开源标识（DAC v1.0.0）：仓库地址来自 src/brand.ts 的 {{REPO_URL}}，
               新标签页打开 + noopener（外链一律按此写）。 -->
          <a id="github-link" class="icon-btn" href="{{REPO_URL}}" target="_blank" rel="noopener noreferrer"
             aria-label="{{t:side.github}}" title="{{BRAND}} on GitHub">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-github" /></svg>
          </a>
          <button id="notify-bell" class="icon-btn" type="button" aria-label="{{t:side.notify}}" title="{{t:side.notify}}">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-bell" /></svg>
            <span id="notify-badge" class="notify-badge" hidden></span>
          </button>
          <!-- 溢出菜单入口：底部导航（节点→改密）与退出登录收在向上打开的弹窗里。
               复用 #i-more（行级「更多」同一个字形）。 -->
          <button id="side-more" class="icon-btn" type="button" aria-label="{{t:nav.more}}" title="{{t:nav.more}}"
            aria-haspopup="menu" aria-expanded="false" aria-controls="side-more-menu">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-more-v" /></svg>
          </button>
        </div>
      </aside>

      <main class="content {{CONTENT_CLASS}}">{{CONTENT}}</main>
    </div>

    <!-- Agent details. A drawer rather than a page: this is a "look something up"
         panel, and opening it should not cost you the conversation you are in. -->
    <div id="agent-panel" class="panel" hidden>
      <div class="panel-backdrop" data-close="1"></div>
      <aside class="panel-body" role="dialog" aria-modal="true" aria-labelledby="agent-panel-title">
        <header class="panel-head">
          <h2 id="agent-panel-title">agent</h2>
          <button class="icon-btn" type="button" data-close="1" aria-label="{{t:common.close}}">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </header>
        <div id="agent-panel-content" class="panel-content"></div>
      </aside>
    </div>

    <!-- 品牌与译文不内联注入：CSP 是 `script-src 'self'`（security.ts），
         内联脚本不会执行。客户端由 shell.js 启动时取一次 /api/i18n/<lang>
         （语言标签就在 <html lang> 上，服务端已渲染好）。 -->
    <script src="/assets/shell.js" type="module"></script>
    {{SCRIPT}}
  </body>
</html>
