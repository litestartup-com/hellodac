# DAC config template. Copy it to manager.config.yaml and fill in the real values.
# manager.config.yaml is excluded by .gitignore (a personal config never enters git).

listen:
  host: 127.0.0.1        # change to 0.0.0.0 before exposing it publicly, and make sure TLS terminates in front
  port: 8080

# DSH endpoints. Option A (direct loopback) and Option B (across machines through the dsh-api-gateway proxy): pick one or run both.
endpoints:
  A:
    url: http://127.0.0.1:3080
    driver: apiproxy     # Option A: talk to DSH's native /api directly (loopback, no key needed)
    prefix: /api
    key_ref: ''
    # Hive P0: route by the chat's sandbox mode (POST /sessions/{id}/sandbox-mode on the dsh-api-gateway).
    # An agent that needs it must declare sandbox_mode; without the declaration it never takes this path.
    sandbox_base: http://127.0.0.1:3080/api-gw/v1
    sandbox_key_ref: GW_KEY_A   # must match apiKeys in the DSH gateway
    # Hive P1: let the manager supervise that node's process (start/stop/self-heal on crash). Unmanaged by default --
    # a DSH you started by hand is never taken over by the manager. A managed node needs its own profile and port:
    # spawn:
    #   managed: true
    #   command: node
    #   args: ["C:/nvm4w/nodejs/node_modules/@deepseek-ai/dsh/lib/bin.js", "--profile", "web", "--no-open"]
    #   ready_timeout_ms: 30000
    #   # Hive v1.1: a node's own DSH_HOME (chats/settings/attachments are mutually invisible), generated by setup:
    #   env: { DSH_HOME: "C:/Users/you/.dac/dac-personal" }
    #   # Started standalone with the CLI `npm run nodes -- up` it uses detached + log_file (the process survives on its own,
    #   # logs go to a file, the pidfile lets a later process bring it down); started with the resident manager it stays at false:
    #   detached: true
    #   log_file: ./data/nodes/web.log
  # Option B (across machines / container nodes) example:
  # B:
  #   url: http://<host>:3080
  #   driver: apiproxy
  #   prefix: /api-gw/v1/proxy
  #   key_ref: GW_KEY_B

agents:
  personal:
    name: 个人
    endpoint: A
    workspace: C:/path/to/your/workspace   # <- change this to your real workspace path
    public: false
    # Hive P0: which agent preset a chat uses (available values in the DSH agentPreset.list:
    # standard default / code / minimal / cordis). Absent = the DSH deployment default.
    preset: standard
    # Hive P0: per-chat sandbox mode (read-only / workspace-write).
    # Absent = no override, so the DSH deployment default stands.
    sandbox_mode: workspace-write
    # Debt E12: the governance rules of that workspace (note-data validation moved out, optional).
    # Absent = only the generic credential check, inheriting no business rules of any particular workspace.
    # Example (available to note-kaka users):
    # validate:
    #   windows:
    #     - { path: trade.history, max: 8, archive: E03.10.01-交易大盘.md }
    #     - { path: weekly.weeks, max: 26, archive: G-日志/00-2026年周报 }
    #     - { path: weekly.logs, max: 10, archive: G01.08-2026年/0X月份 }
    #   forbid_amount_fields: true
    #   acct_flow_max_age_months: 1

runner:
  timeout_minutes: 15
  silence_timeout_minutes: 5
  max_consecutive_failures: 3
  daily_budget_usd: 2.0

database:
  path: ./data/manager.db

pricing:
  peak_windows_utc:
    - { start: '01:00', end: '04:00' }
    - { start: '06:00', end: '10:00' }
  models:
    deepseek-v4-pro:
      off_peak: { input: 0.66, output: 1.98, cache_read: 0.022 }
      peak: { input: 1.32, output: 3.96, cache_read: 0.044 }
    deepseek-v4-flash:
      off_peak: { input: 0.22, output: 0.66, cache_read: 0.007 }
      peak: { input: 0.44, output: 1.32, cache_read: 0.014 }
