name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # P2-2: lint catches a few classes of real bugs the type system cannot: hanging promises / misused promises
      - run: npm run lint
      - run: npm test
      # Debt C4: coverage gate (in force since 2026-09-12) -- production code only (src, tests excluded),
      # thresholds lines 80 / branch 70 / funcs 75 (measured baseline 85.18/78.19/83.08, headroom left against false alarms);
      # below the threshold it exits non-zero and CI goes red. Raised step by step as C2 adds tests.
      - run: npm run test:coverage
      # P2-1: the frontend tests never ran in CI before this -- md.js escape-first is the only defense against XSS
      - run: npm run test:web
      - run: npm run drill
      - run: npm run build
      - run: node scripts/fresh-boot-smoke.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/check-docs.mjs

  compose-e2e:
    # Debt R10 (= C5): full-stack compose E2E (nginx + manager + spine brain + dynamic worker bees).
    # Verifies the release gate: start / login / node claim / dynamic provisioning / shutdown / restore protection / deregistration.
    # The precondition for validating any later container or deployment change -- do not push production deployment-chain validation forward before this job is green.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare compose truth files
        run: |
          MANAGER_PASSWORD=compose-e2e-init-pass bash scripts/gen-env.sh
          echo 'DEEPSEEK_API_KEY=sk-dummy-for-e2e' >> .env
          cp manager.config.container.example.yaml manager.config.yaml
          cp deploy/nginx/default.conf.example deploy/nginx/default.conf
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Compose E2E
        run: node scripts/compose-e2e.mjs
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
