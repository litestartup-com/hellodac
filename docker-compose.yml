# Hive plan 2 P2: the spine compose -- nginx + manager + the brain.
# Worker containers (personal and the nodes the wizard adds) are started dynamically by the manager over docker.sock (P2b reconcile).
#
# Usage:
#   bash scripts/gen-env.sh           # generate .env (idempotent, existing values are not overwritten; fill in DEEPSEEK_API_KEY)
#   cp manager.config.container.example.yaml manager.config.yaml
#   docker compose up -d --build
#
# The brain = the spine (declared by compose, unmanaged: up/down gives 409, state/logs are read-only).
name: dac

services:
  nginx:
    image: nginx:alpine
    container_name: dac-nginx
    ports:
      - "80:80"
      # Used by the TLS modes (origin-ca/letsencrypt); harmless to leave unused on a plain HTTP direct connection
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates (in origin-ca/letsencrypt mode install.sh generates the config; the directory is created automatically)
      - ./ssl:/etc/ssl/dac:ro
    depends_on:
      - manager
    networks: [hive]

  manager:
    build:
      context: .
      dockerfile: images/manager/Dockerfile
    image: hellodac/dac-manager:${MANAGER_VERSION:-1.0.0}
    container_name: dac-manager
    env_file: .env
    # Debt H1: the manager runs non-root (the same HOST_UID convention as node-brain);
    # docker.sock access is injected through group_add with the host docker group GID (gen-env.sh
    # probes it into .env). The host-side owner of the truth files and the data directory is released
    # by install.sh under the same HOST_UID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:?DOCKER_GID missing in .env — run: bash scripts/gen-env.sh}"
    volumes:
      # rw: the wizard writes new nodes back into manager.config.yaml and .env (the files are the truth)
      - ./.env:/app/.env
      - ./manager.config.yaml:/app/manager.config.yaml
      - ./data:/app/data
      # Worker lifecycle: the manager manages local node containers through the host dockerd (the Portainer pattern)
      - /var/run/docker.sock:/var/run/docker.sock
      # The workspace uses the same absolute path on the host and inside the container (/opt/dac/workspaces),
      # so the bind mount paths the manager sends to dockerd really exist on the host.
      - ./workspaces:/opt/dac/workspaces
    depends_on:
      - node-brain
    restart: unless-stopped
    networks: [hive]

  node-brain:
    build:
      context: images/node
      dockerfile: Dockerfile
    image: ${DSH_NODE_IMAGE:-hellodac/dac-node:0.1.2-rc.1}
    container_name: dac-node-brain
    # Capability three v1: the GUI port is published to the host loopback only (an SSH tunnel target; never on the public surface)
    ports:
      - "127.0.0.1:3082:3082"
    # The same uid as the host deploy user: workspace bind mounts read and write identically on both sides (the same convention as v0.1)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # 0.1.2: --trusted-host is gone (the CLI has no such flag, passing it fails startup outright);
    # the /api surface is no longer used, the manager goes through the facade (/api-gw/v1/proxy + GW_KEY auth).
    command: ["--port", "3082"]
    environment:
      DSH_HOME: /data
      GW_KEY: ${GW_KEY_B}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      BRAIN_TOKEN: ${BRAIN_TOKEN}
      # Used by the brain's skill manual to call the manager's internal API (inside the container 127.0.0.1 is the node itself)
      MANAGER_URL: "http://manager:8080"
    volumes:
      - dac-brain:/data
      # Mounted at the same absolute path the manager sees: that path is the workspace cwd the manager hands to the node,
      # and the same string must exist inside the node container (otherwise session.create EACCES mkdir /opt)
      - ./workspaces/brain:/opt/dac/workspaces/brain
    restart: unless-stopped
    networks: [hive]

volumes:
  dac-brain:

networks:
  # Named explicitly: the manager's docker runner joins worker containers to the network by this name on the host
  # dockerd side (compose would prefix the project name as dac_hive, and writing hive in the config gives 404 no such network)
  hive:
    name: dac-hive
