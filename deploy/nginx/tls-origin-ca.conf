# Hive plan 2 P2: TLS mode one -- Cloudflare Origin CA (the user places the certificate files).
# Usage: replace __APP_DOMAIN__ / __SSL_CERT_PATH__ / __SSL_KEY_PATH__, then save as default.conf.
# Port 80 requests for the IP or any other Host are uniformly 301-redirected to the real domain (a direct IP hit does not "die", it jumps to the domain).
server {
    listen 80 default_server;
    server_name _;
    return 301 https://__APP_DOMAIN__$request_uri;
}

server {
    listen 80;
    server_name __APP_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __APP_DOMAIN__;
    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Debt H1: the brain internal API only admits the private network. Brain nodes reach the manager directly over the
    # manager:8080 internal network and do not come through here; this is the second gate beyond the token -- public
    # requests (including those proxied by Cloudflare) are always 403.
    location /api/internal/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
