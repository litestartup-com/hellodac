# Hive plan 2 P2: TLS mode two -- Let's Encrypt (certbot --nginx).
# Start nginx with this file first (port 80 passthrough), then run certbot --nginx -d __APP_DOMAIN__;
# certbot rewrites it itself into 443 + certificate config. Replace __APP_DOMAIN__ before saving it as default.conf.
server {
    listen 80;
    server_name __APP_DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Debt H1: the brain internal API only admits the private network. Brain nodes reach the manager directly over the
    # manager:8080 internal network and do not come through here; this is the second gate beyond the token -- public
    # requests (including those proxied by Cloudflare) are always 403.
    location /api/internal/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
