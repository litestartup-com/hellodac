# Hive plan 2 P2: example config for the container form (the compose spine).
# Copy it to manager.config.yaml to use it; install.sh (P5) generates it automatically.
#
# Notes:
# - inside the manager container the same absolute path /opt/dac/workspaces is shared with the host (compose mount),
#   so the bind mount paths the manager sends to dockerd really exist on the host;
# - the brain has no spawn: declared by compose (the spine, unmanaged -- read-only control);
# - personal is the first worker: a docker runner, started by the manager over docker.sock.
# - config_version: the config structure version (P0, hive/plan-config-version-switch) --
#   a new install generates the current version, upgrades migrate automatically at boot.

config_version: 1

listen:
  host: 0.0.0.0
  port: 8080

endpoints:
  # The 0.1.2 switch to the main route, wiring checklist: the manager goes through the facade (an in-process front plus key
  # auth) and no longer talks to the host /api directly (the 0.1.2 /api is a trust fence, 401 even on loopback).
  brain:
    url: http://node-brain:3082
    driver: apiproxy
    prefix: /api-gw/v1/proxy
    key_ref: GW_KEY_B
    sandbox_base: http://node-brain:3082/api-gw/v1
    sandbox_key_ref: GW_KEY_B

  personal:
    url: http://node-personal:3081
    driver: apiproxy
    prefix: /api-gw/v1/proxy
    key_ref: GW_KEY_A
    sandbox_base: http://node-personal:3081/api-gw/v1
    sandbox_key_ref: GW_KEY_A
    spawn:
      managed: true
      runner: docker
      ready_timeout_ms: 30000
      docker:
        image: hellodac/dac-node:0.2.0-rc.2
        # consistent with the explicitly named network in compose (the manager joins it on the host dockerd side)
        network: dac-hive
        port: 3081
        host_volumes:
          # left = host path (install.sh replaces it with the real install dir path); right = path inside the node container,
          # it must be the same string as agents.workspace -- the manager sends workspace to the node as its cwd
          /opt/dac/workspaces/personal: /opt/dac/workspaces/personal
        named_volumes:
          dac-personal: /data

agents:
  brain:
    name: Brain
    endpoint: brain
    workspace: /opt/dac/workspaces/brain
    preset: standard
    sandbox_mode: workspace-write
  personal:
    name: Personal
    endpoint: personal
    workspace: /opt/dac/workspaces/personal
    preset: standard
    sandbox_mode: workspace-write

runner:
  timeout_minutes: 15
  silence_timeout_minutes: 5
  max_consecutive_failures: 3
  daily_budget_usd: 2.0

brain:
  daily_budget_usd: 1.0

database:
  path: ./data/manager.db

# Hive plan 2 P4: extra docker named volumes taken into the backup (the brain volume of the compose spine has no spawn
# section, so declaring it here packs and encrypts it along with the automatic backup).
backup:
  docker_volumes:
    - dac-brain

pricing:
  peak_windows_utc:
    - { start: '01:00', end: '04:00' }
    - { start: '06:00', end: '10:00' }
  models:
    deepseek-v4-pro:
      off_peak: { input: 0.66, output: 1.98, cache_read: 0.022 }
      peak: { input: 1.32, output: 3.96, cache_read: 0.044 }
    deepseek-v4-flash:
      off_peak: { input: 0.22, output: 0.66, cache_read: 0.007 }
      peak: { input: 0.44, output: 1.32, cache_read: 0.014 }
